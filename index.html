<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baron Motorsport · Countdown</title>
<link rel="icon" href="logo.svg">
<style>
  :root { --bg: #0e0f12; --fg: #f2f2f2; --muted: #8a8f98; --accent: #e10600; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font-family: system-ui, sans-serif; text-align: center; padding: 16px; }
  #label { color: var(--accent); text-transform: uppercase; letter-spacing: .15em; font-weight: 700; }
  #name { font-size: clamp(1.5rem, 5vw, 3rem); margin: .3em 0; }
  #when, #next { color: var(--muted); }
  #clock { display: flex; gap: clamp(8px, 3vw, 32px); justify-content: center; margin: 1em 0; }
  #clock div { min-width: 3.5ch; }
  #clock b { display: block; font-size: clamp(2.5rem, 12vw, 6rem); font-variant-numeric: tabular-nums; line-height: 1; }
  #clock span { color: var(--muted); font-size: .8rem; text-transform: uppercase; }
  #logo { width: min(320px, 70vw); margin-bottom: 1.5em; }
  ul { list-style: none; padding: 0; margin: 2em 0 0; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <img id="logo" src="logo.svg" alt="Baron Motorsport">
  <div id="label">Prossimo evento</div>
  <h1 id="name">—</h1>
  <div id="when"></div>
  <div id="clock">
    <div><b id="d">0</b><span>giorni</span></div>
    <div><b id="h">00</b><span>ore</span></div>
    <div><b id="m">00</b><span>min</span></div>
    <div><b id="s">00</b><span>sec</span></div>
  </div>
  <ul id="next"></ul>
</main>
<script>
// Modifica qui: data ISO con fuso orario (+02:00 = ora legale Italia, +01:00 = ora solare).
// ponytail: ordine qualsiasi, lo script ordina e salta quelli passati.
const EVENTS = [
  // Monza 25-27/09/2026 — GT Open (Provisional schedule Draft 1)
  { name: "Monza · RFID tag pick-up",                 start: "2026-09-24T09:00:00+02:00" },
  { name: "Monza · Private test 1",                   start: "2026-09-24T11:10:00+02:00" },
  { name: "Monza · Private test 2",                   start: "2026-09-24T14:50:00+02:00" },
  { name: "Monza · Ritiro gomme Michelin (Bronze)",   start: "2026-09-24T17:00:00+02:00" },
  { name: "Monza · Ritiro gomme Michelin",            start: "2026-09-24T17:30:00+02:00" },
  { name: "Monza · Track walk",                       start: "2026-09-24T18:15:00+02:00" },
  { name: "Monza · Technical scrutineering",          start: "2026-09-25T09:10:00+02:00" },
  { name: "Monza · Briefing piloti & TM",            start: "2026-09-25T10:00:00+02:00" },
  { name: "Monza · Briefing Team Manager",            start: "2026-09-25T10:30:00+02:00" },
  { name: "Monza · Free practice 1",                  start: "2026-09-25T11:20:00+02:00" },
  { name: "Monza · Free practice 2",                  start: "2026-09-25T15:50:00+02:00" },
  { name: "Monza · Ritiro gomme Michelin",            start: "2026-09-25T17:30:00+02:00" },
  { name: "Monza · Free practice 3 (Bronze)",         start: "2026-09-26T09:00:00+02:00" },
  { name: "Monza · Qualifying 1 (Driver 1)",          start: "2026-09-26T11:20:00+02:00" },
  { name: "Monza · Qualifying 2 (Driver 2)",          start: "2026-09-26T14:45:00+02:00" },
  { name: "Monza · Pit lane open (GT Open 500)",      start: "2026-09-27T12:10:00+02:00" },
  { name: "Monza · GARA GT Open 500",                 start: "2026-09-27T12:30:00+02:00" },
];

const fmt = new Intl.DateTimeFormat("it-IT", { dateStyle: "full", timeStyle: "short" });
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const upcoming = EVENTS.map(e => ({ ...e, t: new Date(e.start) })).sort((a, b) => a.t - b.t);

function tick() {
  const now = Date.now();
  const list = upcoming.filter(e => e.t > now);
  if (!list.length) { $("name").textContent = "Nessun evento in programma"; $("when").textContent = ""; $("clock").hidden = true; return; }
  const [e, ...rest] = list;
  const diff = Math.floor((e.t - now) / 1000);
  $("name").textContent = e.name;
  $("when").textContent = fmt.format(e.t);
  $("d").textContent = Math.floor(diff / 86400);
  $("h").textContent = pad(Math.floor(diff / 3600) % 24);
  $("m").textContent = pad(Math.floor(diff / 60) % 60);
  $("s").textContent = pad(diff % 60);
  $("next").innerHTML = rest.slice(0, 3).map(r => `<li>${r.name} — ${fmt.format(r.t)}</li>`).join("");
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
